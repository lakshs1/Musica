<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Musync">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Musync</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Bypasses YouTube player background detection by locking visibility state to visible
    Object.defineProperty(document, 'visibilityState', {
      value: 'visible',
      writable: false,
      configurable: true
    });
    Object.defineProperty(document, 'hidden', {
      value: false,
      writable: false,
      configurable: true
    });
    
    // Block visibilitychange events from reaching the page / YouTube iframe
    document.addEventListener('visibilitychange', function(e) {
      e.stopImmediatePropagation();
    }, true);
    
    // Add a continuous silent audio player to keep the audio context alive
    window.addEventListener('load', function() {
      var silentAudio = document.createElement('audio');
      silentAudio.id = 'silent-audio-keeper';
      silentAudio.loop = true;
      // 1-second silent WAV base64
      silentAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
      document.body.appendChild(silentAudio);
      
      var playSilent = function() {
        silentAudio.play().then(function() {
          console.log('Silent audio context activated successfully.');
          window.removeEventListener('click', playSilent);
          window.removeEventListener('touchstart', playSilent);
        }).catch(function(e) {
          console.log('Autoplay blocked silent audio:', e);
        });
      };
      window.addEventListener('click', playSilent);
      window.addEventListener('touchstart', playSilent);
    });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
